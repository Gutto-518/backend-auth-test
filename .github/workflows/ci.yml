# =========================================================
# CI Pipeline - Corre en cada Pull Request hacia main
# =========================================================
# Flujo: UT (unit tests) -> E2E (end-to-end tests)
# Si los UT fallan, los E2E NO se ejecutan (gracias a "needs")
# =========================================================

name: CI - Unit Tests & E2E

# Cuando se activa este workflow:
# - Al crear un PR hacia main
# - Al hacer push a un PR existente hacia main
on:
  pull_request:
    branches:
      - main

jobs:
  # =====================
  # JOB 1: Unit Tests
  # =====================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el codigo del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Instala Node.js (version 20 LTS)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instala pnpm (el package manager que usa tu proyecto)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 4. Instala las dependencias del proyecto
      - name: Install dependencies
        run: pnpm install

      # 5. Corre los unit tests con cobertura
      - name: Run Unit Tests
        run: pnpm api:tests:ut

  # =====================
  # JOB 2: E2E Tests
  # =====================
  # "needs: unit-tests" significa:
  # - Espera a que unit-tests termine
  # - Solo corre si unit-tests PASO
  # - Si unit-tests falla, este job se SALTA
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Run E2E Tests
        run: pnpm api:tests:e2e
